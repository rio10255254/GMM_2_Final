name: Validate Governance

on:
  pull_request:
  push:
    branches:
      - main
      - sandbox/r38v2
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      # Some tracked paths run past Windows' 260-character limit (the longest is 465),
      # so checkout fails with "Filename too long" unless git may use long paths.
      - name: Allow long paths in git
        run: git config --system core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run project control center standard health
        run: python Tools/project_control_center.py --view health --health-level standard
