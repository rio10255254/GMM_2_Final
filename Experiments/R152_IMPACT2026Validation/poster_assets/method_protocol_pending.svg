    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(709.2 198.443734)">Subpixel boundary points</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(709.2 214.8165)">Geometric least-squares centers</text>
   </g>
