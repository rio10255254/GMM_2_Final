    <text style="fill: #17334e; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="32.4" y="30.24" transform="rotate(-0 32.4 30.24)">R152 evaluation on the locked IMPACT protocol</text>
   </g>
   <g id="text_2">
    <text style="fill: #9e4c12; font: 12px 'DejaVu Sans'; text-anchor: start" x="32.4" y="63.36" transform="rotate(-0 32.4 63.36)">METHOD PREPARATION  |  Cross-magnification R152 results are pending</text>
   </g>
   <g id="text_3">
    <text style="fill: #17334e; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="46.8" y="132.277969" transform="rotate(-0 46.8 132.277969)">FIXED INPUTS</text>
   </g>
   <g id="text_4">
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(46.8 165.698203)">20x / 50x; 0.5 / 1.0 um</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(46.8 182.070969)">30 adjacent pairs per condition</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(46.8 198.443734)">120 pairs; 166 distinct frames</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(46.8 214.8165)">Same nine pillars; native grid</text>
   </g>
   <g id="text_5">
    <text style="fill: #17334e; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="374.4" y="132.277969" transform="rotate(-0 374.4 132.277969)">THREE IMAGE METHODS</text>
   </g>
   <g id="text_6">
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(374.4 165.698203)">Raw</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(374.4 182.070969)">Fixed Wiener: original optics</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(374.4 198.443734)">R152: delivered weights fixed</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(374.4 214.8165)">50x R152 optics: unresolved</text>
   </g>
   <g id="text_7">
    <text style="fill: #17334e; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="709.2" y="132.277969" transform="rotate(-0 709.2 132.277969)">ONE MEASUREMENT METHOD</text>
   </g>
