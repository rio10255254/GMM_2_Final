    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(371.52 200.603734)">R152 at 50x: calibrated 1 PSF</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(371.52 216.9765)">Same learned weights</text>
   </g>
   <g id="text_7">
