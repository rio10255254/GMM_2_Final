    <text style="fill: #17334e; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="32.4" y="32.4" transform="rotate(-0 32.4 32.4)">R152 with objective-specific optical input</text>
   </g>
   <g id="text_2">
    <text style="fill: #36576e; font: 12px 'DejaVu Sans'; text-anchor: start" x="32.4" y="68.4" transform="rotate(-0 32.4 68.4)">120 original pairs | same learned weights | calibrated optical input | no retraining</text>
   </g>
   <g id="text_3">
    <text style="fill: #17334e; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="45.36" y="134.437969" transform="rotate(-0 45.36 134.437969)">FIXED DATA</text>
   </g>
   <g id="text_4">
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(45.36 167.858203)">20x / 50x; 0.5 / 1.0 um</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(45.36 184.230969)">30 adjacent pairs per condition</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(45.36 200.603734)">166 different frames</text>
    <text style="fill: #273c4f; font: 11.5px 'DejaVu Sans'" transform="translate(45.36 216.9765)">Same nine pillar identities</text>
   </g>
   <g id="text_5">
    <text style="fill: #17334e; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="371.52" y="134.437969" transform="rotate(-0 371.52 134.437969)">IMAGE METHODS</text>
   </g>
   <g id="text_6">
